# ============================================================================
#  The Sims 2 PSP - EBOOT.BIN (decrypted)
#
#  GENERATED BY tools/gen_splat_config.py - edit that script, not this file.
#
#  The binary is a Sony `~PSP` signed, PSPLINK generated ELF.  Sony's linker
#  emits one output section per input translation unit (the game was built
#  with -ffunction-sections), which is what gives us `collision`, `drawing`,
#  `renderCommon`, ... below.  Everything PSPLINK generated itself - import
#  stubs, library stub tables, NID tables - is kept as a raw binary blob: it
#  is not game code and re-creating it in C would be wrong.
#
#  Addresses are module relative: the EBOOT is linked with base address 0 and
#  relocated to 0x08804000 by the PSP loader at run time, so `start` (the file
#  offset) and `vram` (the linked address) differ by the ELF header size.
# ============================================================================
name: eboot
sha1: a65b73c34233ad1de8574d7c1d82195852d31a52
options:
  basename: eboot.elf
  target_path: disks/pgs-si2/EBOOT.dec
  base_path: ..
  platform: psp
  compiler: GCC
  endianness: little

  # The original ELF header says `0x10a23001, noreorder, allegrex, eabi32,
  # mips2`, which is what psp-gcc produces with its default `-mabi=eabi`.
  # That is the o32 register file, so registers 4-11 are $t0-$t7, not the n32
  # $a4-$a7, and gas will only accept the o32 spellings.
  mips_abi_gpr: o32
  mips_abi_float_regs: numeric

  asm_path: asm/eboot
  src_path: src/eboot
  asset_path: assets/eboot
  o_path: build/eboot
  build_path: build

  ld_script_path: build/config/eboot.elf.ld
  ld_generate_symbol_per_data_segment: true

  symbol_name_format: eboot_$VRAM
  symbol_name_format_no_rom: $VRAM

  create_asm_dependencies: true
  create_undefined_funcs_auto: true
  create_undefined_syms_auto: true
  undefined_funcs_auto_path: build/config/eboot.undefined_funcs_auto.txt
  undefined_syms_auto_path: build/config/eboot.undefined_syms_auto.txt

  find_file_boundaries: true
  o_as_suffix: true

  symbol_addrs_path:
    - config/eboot.symbol_addrs.txt
  reloc_addrs_path:
    - config/eboot.reloc_addrs.txt

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 0
  data_string_guesser_level: 0
  add_set_gp_64: false
  pair_rodata_to_text: true
  suggestion_rodata_section_start: true
  named_regs_for_c_funcs: false
  migrate_rodata_to_functions: true
  ld_bss_is_noload: true
  disassemble_all: true
  auto_decompile_empty_functions: true
  make_full_disasm_for_code: true

  asm_inc_header: |
    .set noat      /* allow manual use of $at */
    .set noreorder /* don't insert nops after branches */

  section_order:
    - .text
    - .sceStub.text.InterruptManager
    - .sceStub.text.sceLibFont
    - .sceStub.text.sceAtrac3plus
    - .sceStub.text.sceAudio
    - .sceStub.text.sceSasCore
    - .sceStub.text.scePower
