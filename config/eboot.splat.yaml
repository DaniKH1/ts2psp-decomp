    - .sceStub.text.UtilsForUser
    - .sceStub.text.ThreadManForUser
    - .sceStub.text.SysMemUserForUser
    - .sceStub.text.StdioForUser
    - .sceStub.text.ModuleMgrForUser
    - .sceStub.text.LoadExecForUser
    - .sceStub.text.Kernel_Library
    - .sceStub.text.IoFileMgrForUser
    - .text.collision
    - .text.sortAndCullScene
    - .text.updateNodeGraph
    - .text.syncSkeleton
    - .text.drawing
